<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101b22">
  <meta name="description" content="李银的个人空间。走进海边观测站，打开自叙帖，探索研究、项目和收藏。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="李银 · My Personal Space">
  <meta property="og:description" content="走进海边观测站，打开自叙帖，探索研究、项目和收藏。">
  <meta property="og:image" content="https://nanfengjunhuai.github.io/mysite/assets/img/station-workshop.webp">
  <meta name="twitter:card" content="summary_large_image">
  <title>李银 · My Personal Space</title>
  <link rel="icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/experience.css">
  <link rel="stylesheet" href="assets/css/arrival.css">
  <link rel="stylesheet" href="assets/css/survey.css">
  <link rel="stylesheet" href="assets/css/atlas.css">
  <link rel="preload" href="assets/img/station-workshop.webp" as="image">
  <script defer src="content/site.js"></script>
  <script defer src="content/notes.js"></script>
  <script defer src="content/projects.js"></script>
  <script defer src="content/collection.js"></script>
  <script defer src="content/field-study.js"></script>
  <script defer src="content/robotics-study.js"></script>
  <script defer src="assets/js/robotics-study.js"></script>
  <script defer src="assets/js/survey.js"></script>
  <script defer src="assets/js/atlas.js"></script>
  <script defer src="assets/js/experience.js"></script>
  <script defer src="assets/js/arrival.js"></script>
</head>
<body>
  <section id="arrival" aria-label="抵达观测站" hidden>
    <div class="arrival-film" aria-hidden="true"></div>
    <canvas aria-hidden="true"></canvas>
    <div class="arrival-grade" aria-hidden="true"></div>
    <div class="arrival-frame">
      <div class="arrival-heading"><strong lang="en">My Personal Space</strong><span>李银 · 观测站</span></div>
      <button id="arrival-sound" type="button" aria-pressed="false" aria-label="开启开场音效">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 8h3l4-3v10l-4-3H3zM13 7a4 4 0 010 6m2-8a7 7 0 010 10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16 16 4" class="mute-line" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>音效</span>
      </button>
      <button type="button" id="flight-access">进入工作台</button>
      <div class="flight-readout" role="status"><strong id="flight-status">跃迁中</strong><span id="flight-caption">正在前往观测站</span></div>
    </div>
  </section>
  <main id="experience" aria-label="李银的个人空间">
    <div id="scenes" class="scenes"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="shutter" aria-hidden="true"><div class="passage"></div></div>
    <aside id="field-note" class="field-note" aria-labelledby="field-note-name" hidden>
      <div role="status"><h2 id="field-note-name"></h2><p></p></div>
      <button type="button" aria-label="收起观察记录">×</button>
    </aside>
    <a id="field-back" href="#research" hidden><span aria-hidden="true">‹</span> 返回研究室</a>
    <header class="signature">
      <a class="home" href="#desk" aria-label="李银的个人空间，回工作台"><span class="orbit-mark" aria-hidden="true"></span><span><strong lang="en">My Personal Space</strong><small id="owner">李银</small></span></a>
    </header>
    <footer class="scene-controls">
      <div class="scene-location" aria-live="polite"><span id="location-kicker">观测站</span><strong id="location-name" tabindex="-1">工作台</strong></div>
      <div class="scene-buttons">
        <div class="view-track" aria-hidden="true"><i></i></div>
        <button type="button" id="look-left" class="look" aria-label="向左看">‹</button>
        <button type="button" id="atlas" aria-haspopup="dialog" aria-controls="station-atlas"><span aria-hidden="true">◇</span> 航图</button>
        <button type="button" id="look-right" class="look" aria-label="向右看">›</button>
      </div>
    </footer>
    <noscript><p class="no-script"><a href="workroom.html">打开工作台</a></p></noscript>
  </main>
  <dialog class="visor" id="visor" aria-labelledby="visor-title">
    <div class="visor-head">
      <h2 id="visor-title"></h2>
      <form method="dialog"><button type="submit" aria-label="关闭">×</button></form>
    </div>
    <div id="visor-content" class="visor-content"></div>
  </dialog>
  <dialog id="station-atlas" aria-labelledby="station-atlas-title">
    <header class="atlas-header">
      <div><span id="atlas-location"></span><h2 id="station-atlas-title">站内航图</h2></div>
      <form method="dialog"><button type="submit" aria-label="关闭航图">×</button></form>
    </header>
    <div class="atlas-layout">
      <div class="atlas-map" role="group" aria-label="观测站舱室"></div>
      <section class="atlas-preview" aria-labelledby="atlas-room-name">
        <div class="atlas-window"><img alt="" decoding="async"><span class="atlas-indicator" aria-hidden="true"></span></div>
        <div class="atlas-room-info"><div><h3 id="atlas-room-name"></h3><p></p></div><button type="button" id="atlas-enter">进入</button></div>
        <a class="atlas-orbit" href="world.html">观察站体外部 <span aria-hidden="true">↗</span></a>
      </section>
    </div>
  </dialog>
  <dialog id="coast-survey" aria-labelledby="survey-title">
    <div class="survey-viewport">
      <canvas aria-hidden="true"></canvas>
      <div class="survey-pins" aria-label="海岸城地标"></div>
    </div>
    <header class="survey-header">
      <div><span>研究室</span><h2 id="survey-title">海岸城 · 地形观测</h2></div>
      <form method="dialog"><button type="submit" class="survey-close" aria-label="关闭地形台，返回研究室" autofocus>×</button></form>
    </header>
    <div class="survey-dock">
      <article class="survey-route" aria-labelledby="survey-route-name">
        <div class="survey-route-media"><img alt="" decoding="async"></div>
        <div class="survey-route-body">
          <h3 id="survey-route-name" aria-live="polite"></h3>
          <p></p>
          <a id="survey-enter" href="#coast">进入路线 <span aria-hidden="true">↗</span></a>
        </div>
      </article>
      <div class="survey-actions">
        <button type="button" aria-label="向左转动地形" data-view="left">‹</button>
        <a href="#coast">从石拱岔路出发</a>
        <button type="button" aria-label="向右转动地形" data-view="right">›</button>
      </div>
    </div>
  </dialog>
</body>
</html>
