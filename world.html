<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a1017">
  <title>李银的个人空间 · My Personal Space</title>
  <meta name="description" content="李银的个人空间。一座可以转动观察的观测站，通往自叙帖、研究室、项目库和收藏室。">
  <link rel="icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/world.css">
  <script defer src="content/site.js"></script>
  <script defer src="content/notes.js"></script>
  <script defer src="assets/vendor/three-r159.min.js"></script>
  <script defer src="assets/img/observatory-textures.js"></script>
  <script defer src="assets/js/observatory.js"></script>
  <script defer src="assets/js/world.js"></script>
</head>
<body>
  <main id="world">
    <canvas id="station" aria-hidden="true"></canvas>
    <header class="identity">
      <div class="identity-symbol" aria-hidden="true"></div>
      <h1><span>观测站</span><small lang="en">My Personal Space · <span id="station-owner" lang="zh-CN">李银</span></small></h1>
    </header>
    <a class="world-return" href="experience.html#desk">返回工作台 <span aria-hidden="true">↗</span></a>
    <div class="station-ports" aria-label="观测站舱室">
      <button type="button" class="port" data-room="story" data-color="amber"><span>自叙帖</span></button>
      <button type="button" class="port" data-room="research" data-color="mint"><span>研究室</span></button>
      <button type="button" class="port" data-room="projects" data-color="lilac"><span>项目库</span></button>
      <button type="button" class="port" data-room="collection" data-color="blue"><span>收藏室</span></button>
    </div>
    <div class="orbit-controls" aria-label="观察视角">
      <button type="button" id="orbit-left" aria-label="向左观察">‹</button>
      <span id="orbit-hint">拖动观察</span>
      <button type="button" id="orbit-right" aria-label="向右观察">›</button>
      <a id="berth-jump" href="#berth">巡检泊位 <span aria-hidden="true">↗</span></a>
    </div>
    <section class="room-console" id="room-console" aria-labelledby="room-name" hidden>
      <button type="button" class="room-back" id="room-back">‹ 全景</button>
      <h2 id="room-name"></h2>
      <p id="room-detail" aria-live="polite"></p>
      <button type="button" id="berth-detail" class="room-back" hidden>查看泊位内部</button>
      <a id="room-link" href="experience.html#desk">进入 <span aria-hidden="true">↗</span></a>
    </section>
    <noscript><p class="no-script"><a href="workroom.html">进入静态工作台</a></p></noscript>
  </main>
  <dialog id="world-journal" class="world-journal" aria-labelledby="world-journal-title">
    <form method="dialog"><button type="submit">关闭 <span aria-hidden="true">×</span></button></form>
    <time></time>
    <h2 id="world-journal-title"></h2>
    <div id="world-journal-body"></div>
    <a href="experience.html#story">全部记录 ↗</a>
  </dialog>
  <dialog id="world-berth" class="world-journal berth-detail" aria-labelledby="berth-title">
    <div class="berth-detail-head"><h2 id="berth-title">泊位内部</h2><form method="dialog"><button type="submit" aria-label="关闭泊位内部">×</button></form></div>
    <img id="berth-image" width="1672" height="941" alt="维修栈桥沿两侧延伸，工作灯照亮通往气闸的泊位内部。">
  </dialog>
</body>
</html>
