<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Personal Space</title>
  <meta name="description" content="李银的个人空间。由工作台进入研究室、项目库和自叙帖。">
  <script>
    const rooms = ["#desk", "#story", "#research", "#projects", "#collection", "#coast", "#harbor", "#ridge"];
    const archived = ["#research/field", "#research/robotics"].includes(location.hash);
    const relay = location.hash.startsWith("#relay-");
    const entry = relay ? "nearshore.html" : archived ? "workroom.html" : "experience.html";
    const hash = relay || archived || rooms.includes(location.hash) ? location.hash : "";
    location.replace(entry + location.search + hash);
  </script>
</head>
<body>
  <main><a href="experience.html">进入个人空间</a></main>
</body>
</html>
